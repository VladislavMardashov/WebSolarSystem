<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Солнечная система 3D</title>
<style>
:root{--bg:#000;--fg:#e9edf5;--chip:rgba(16,20,32,.72);--acc:#ffb347;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#bar{position:fixed;left:0;right:0;bottom:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;align-items:center;justify-content:flex-start;overflow:visible;flex-wrap:nowrap;z-index:50}
button{flex:none;border:1px solid rgba(255,255,255,.15);background:var(--chip);color:var(--fg);padding:10px 14px;border-radius:99px;font:inherit;backdrop-filter:blur(8px);cursor:pointer}
button.on{background:var(--acc);color:#111;border-color:var(--acc)}
#fsBtn,#setBtn{width:42px;height:42px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:12px;flex:none}
#setBtn svg{transition:transform .25s}
#setBtn.open{background:var(--acc);color:#111;border-color:var(--acc)}
#setBtn.open svg{transform:rotate(60deg)}
#fps{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:8px;z-index:6;font:11px ui-monospace,monospace;color:var(--fg);opacity:.6;background:rgba(12,16,28,.5);padding:3px 7px;border-radius:8px;border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(6px);pointer-events:none;user-select:none;min-width:96px;text-align:center;transition:opacity .3s}
#skySimCtl{position:fixed;top:calc(40px + env(safe-area-inset-top,0px));left:8px;z-index:25;background:rgba(12,16,28,.92);border:1px solid rgba(255,255,255,.18);border-radius:10px;backdrop-filter:blur(12px);box-shadow:0 6px 22px rgba(0,0,0,.5);padding:8px 10px;display:flex;align-items:center;gap:8px;font-size:11px;user-select:none}
#skySimCtl label{opacity:.75;font-size:11px}
#skySimCtl input[type=range]{width:120px;accent-color:var(--acc);cursor:pointer}
#skySimCtl .v{font-family:ui-monospace,monospace;font-size:10.5px;color:#e9edf5;min-width:34px;text-align:right;opacity:.9}
#load{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .6s}
#load.done{opacity:0;pointer-events:none}
#load .spinner{width:48px;height:48px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--acc);border-radius:50%;animation:_spin 1s linear infinite;display:block;flex:none;box-sizing:border-box}
@keyframes _spin{to{transform:rotate(360deg)}}
#load .pb{width:min(260px,70vw);height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
#load .pb i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s}
#load .tx{font-size:13px;opacity:.75;color:var(--fg)}
.dd{position:relative;z-index:60}
.dd-btn{min-width:120px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:8px}
.dd-btn .tri{font-size:10px;opacity:.7;transition:transform .2s;display:inline-block}
.dd.open .dd-btn .tri{transform:rotate(180deg)}
.dd-list{display:none;position:absolute;bottom:calc(100% + 8px);left:0;min-width:150px;max-height:min(60vh,420px);overflow-y:auto;background:rgba(12,16,28,.95);border:1px solid rgba(255,255,255,.2);border-radius:12px;backdrop-filter:blur(12px);padding:4px;z-index:70;box-shadow:0 8px 28px rgba(0,0,0,.55)}
.dd.open .dd-list{display:block}
.dd-item{display:block;width:100%;text-align:left;padding:8px 12px;border:none;border-radius:8px;background:transparent;color:var(--fg);font:inherit;cursor:pointer}
.dd-item:hover,.dd-item.on{background:rgba(255,179,71,.25)}
.dd-head{padding:9px 12px 3px;margin-top:4px;border-top:1px solid rgba(255,255,255,.14);font-size:11px;opacity:.6;pointer-events:none}
.dd-item.moon{display:flex;align-items:baseline;gap:7px;padding-left:24px;font-size:.94em}
.dd-item.moon .bl{opacity:.6}
.dd-item.moon i{font-style:italic}
#info{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;max-width:280px;background:rgba(12,16,28,.88);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:10px 14px;backdrop-filter:blur(12px);font-size:13px;line-height:1.45;opacity:0;pointer-events:none;transition:opacity .35s;z-index:10}
#info.show{opacity:1;pointer-events:auto}
#info .info-head{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;user-select:none}
#info h3{margin:0;font-size:15px;color:var(--acc)}
#info .info-tri{font-size:11px;opacity:.7;transition:transform .2s}
#info.collapsed .info-tri{transform:rotate(-90deg)}
#info .info-body{overflow:hidden;max-height:400px;transition:max-height .3s ease,opacity .25s,margin .25s}
#info.collapsed .info-body{max-height:0;opacity:0;margin:0}

.label{position:fixed;pointer-events:none;transform:translate(-50%,-120%);white-space:nowrap;font-size:12px;font-weight:500;color:#fff;text-shadow:0 1px 4px #000,0 0 8px rgba(0,0,0,.8);opacity:0;transition:opacity .3s;z-index:5}

#settingsMenu .section-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--fg);opacity:.5;padding:0 4px}
#settingsMenu .seg{display:flex;gap:2px;background:rgba(255,255,255,.05);border-radius:10px;padding:3px}
#settingsMenu .seg button{flex:1;border:none;background:transparent;color:var(--fg);padding:7px 3px;border-radius:7px;font:inherit;font-size:11.5px;cursor:pointer;transition:background .15s,color .15s;white-space:nowrap}
#settingsMenu .seg button:hover{background:rgba(255,255,255,.06)}
#settingsMenu .seg button.on{background:var(--acc);color:#111}
#settingsMenu .toggle{position:relative;display:flex;background:rgba(255,255,255,.05);border-radius:10px;padding:3px;cursor:pointer;user-select:none}
#settingsMenu .toggle .thumb{position:absolute;top:3px;left:3px;width:calc(50% - 3px);height:calc(100% - 6px);background:linear-gradient(135deg,rgba(60,120,220,.9),rgba(90,160,255,.7));border-radius:7px;transition:transform .28s cubic-bezier(.4,.2,.2,1),background .28s;box-shadow:0 2px 8px rgba(60,120,220,.45)}
#settingsMenu .toggle.real .thumb{transform:translateX(100%);background:linear-gradient(135deg,var(--acc),#ffd280);box-shadow:0 2px 8px rgba(255,179,71,.5)}

#settingsMenu .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px;font-size:12.5px}
#settingsMenu .sw{position:relative;width:36px;height:20px;flex:none;display:inline-block}
#settingsMenu .sw input{opacity:0;width:0;height:0;position:absolute}
#settingsMenu .sw span{position:absolute;inset:0;background:rgba(255,255,255,.1);border-radius:99px;cursor:pointer;transition:background .2s}

#fpsBtn{position:fixed;left:8px;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:58;width:42px;height:42px;padding:0;display:none;align-items:center;justify-content:center;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:var(--chip);color:var(--fg);backdrop-filter:blur(8px);cursor:pointer;font-size:19px;line-height:1;font-family:inherit}

.con-label{position:fixed;pointer-events:none;transform:translate(-50%,-50%);font:700 15px system-ui,sans-serif;color:#b8e4ff;text-shadow:0 1px 4px #000,0 0 10px rgba(0,0,0,.9);opacity:0;z-index:6;white-space:nowrap}
.con-label.show{opacity:1}
.sky-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sky-in{width:100%;box-sizing:border-box;background:rgba(255,255,255,.06);color:var(--fg);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:7px 8px;font:inherit;font-size:12px;color-scheme:dark}
.sky-btn{margin-top:6px;width:100%;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:var(--fg);border-radius:8px;padding:7px;font:inherit;font-size:12px;cursor:pointer}
#skyHud{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:5;pointer-events:none;font:12px/1.3 system-ui,sans-serif;color:rgba(255,255,255,.8);text-shadow:0 1px 3px #000;white-space:nowrap}
body.fps-stand .label{display:none!important}

#layersMenu{position:fixed;left:8px;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:55;display:flex;flex-direction:column;gap:10px;background:rgba(12,16,28,.95);border:1px solid rgba(255,255,255,.18);border-radius:14px;backdrop-filter:blur(14px);box-shadow:0 12px 32px rgba(0,0,0,.6);padding:12px;min-width:290px;opacity:0;visibility:hidden;transform:translateY(8px) scale(.98);transition:opacity .18s,transform .18s,visibility 0s linear .18s;pointer-events:none}

#layersMenu .section-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--fg);opacity:.5;padding:0 4px}

#layersMenu .seg button{flex:1;border:none;background:transparent;color:var(--fg);padding:7px 3px;border-radius:7px;font:inherit;font-size:11.5px;cursor:pointer;transition:background .15s,color .15s;white-space:nowrap}

#layersMenu .toggle{position:relative;display:flex;background:rgba(255,255,255,.05);border-radius:10px;padding:3px;cursor:pointer;user-select:none}

#layersMenu .toggle .thumb{position:absolute;top:3px;left:3px;width:calc(50% - 3px);height:calc(100% - 6px);background:linear-gradient(135deg,rgba(60,120,220,.9),rgba(90,160,255,.7));border-radius:7px;transition:transform .28s cubic-bezier(.4,.2,.2,1),background .28s;box-shadow:0 2px 8px rgba(60,120,220,.45)}

#layersMenu .toggle.real .thumb{transform:translateX(100%);background:linear-gradient(135deg,var(--acc),#ffd280);box-shadow:0 2px 8px rgba(255,179,71,.5)}

#layersMenu .toggle .opt{flex:1;text-align:center;padding:7px 10px;font-size:12px;z-index:2;position:relative;transition:color .2s,opacity .2s;color:var(--fg)}

#layersMenu .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px;font-size:12.5px}

#layersMenu .sw{position:relative;width:36px;height:20px;flex:none;display:inline-block}

#layersMenu .sw input{opacity:0;width:0;height:0;position:absolute}

#layersMenu .sw input:checked + span::before{transform:translateX(16px);background:#111}

#layersMenu{bottom:auto;top:calc(58px + env(safe-area-inset-top,0px));left:8px;min-width:232px;transform-origin:top left;transform:translateY(-6px) scale(.97)}
#layersBtn{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:8px;z-index:58;width:42px;height:42px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:12px}

#fps{left:58px!important}

#fpsHint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(118px + env(safe-area-inset-bottom,0px));z-index:57;display:none;flex-direction:column;align-items:center;gap:8px;width:max-content;max-width:min(320px,calc(100vw - 24px));background:rgba(12,16,28,.92);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:10px 14px;backdrop-filter:blur(12px);font-size:12.5px;text-align:center;color:var(--fg)}
body.fps-select #fpsHint{display:flex}
#fpsHint .loc-btn{display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.2);background:var(--acc);color:#111;border-radius:10px;padding:7px 12px;font:inherit;font-size:12px;cursor:pointer}
#fpsHint .st{font-size:11.5px;opacity:.8}
#skyLbl{position:fixed;left:0;top:0;pointer-events:none;z-index:4}

<body>
<div id="load"><div class="spinner" aria-label="Загрузка"></div><div class="pb"><i></i></div><div class="tx">Загрузка…</div></div>
<div id="info"></div>
<div id="bar"></div>
<div id="errPanel"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const errPanel=document.getElementById('errPanel');let errCount=0,errCollapsed=false;
function showError(msg){errCount++;errPanel.classList.add('show');if(errCount===1){errPanel.innerHTML='<div class="h">Ошибки ('+errCount+') — тап чтобы свернуть</div>';errPanel.querySelector('.h').addEventListener('click',()=>{errCollapsed=!errCollapsed;errPanel.querySelector('.h').textContent='Ошибки ('+errCount+') — тап чтобы '+(errCollapsed?'развернуть':'свернуть');errPanel.querySelectorAll('.line').forEach(el=>el.style.display=errCollapsed?'none':'block');});}else{errPanel.querySelector('.h').textContent='Ошибки ('+errCount+') — тап чтобы '+(errCollapsed?'развернуть':'свернуть');}const line=document.createElement('div');line.className='line';line.textContent=msg;if(errCollapsed)line.style.display='none';errPanel.append(line);console.error(msg);}
window.addEventListener('error',e=>showError('[error] '+(e.message||e.error||'unknown')));
window.addEventListener('unhandledrejection',e=>showError('[promise] '+((e.reason&&e.reason.message)||e.reason||'unknown')));
const safeStorage={available:false,get(k){try{return window.localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{window.localStorage.setItem(k,v);return true;}catch(e){return false;}},remove(k){try{window.localStorage.removeItem(k);return true;}catch(e){return false;}}};
try{window.localStorage.getItem('__probe__');safeStorage.available=true;}catch(e){}
function getQualityFromHash(){const m=(location.hash||'').match(/[#&]?q=(auto|high|medium|low)/);return m?m[1]:null;}
let AUTO_QUALITY='high';
try{const mem=navigator.deviceMemory;const cores=navigator.hardwareConcurrency||4;if(mem!==undefined&&mem<=2)AUTO_QUALITY='low';else if(cores<=2)AUTO_QUALITY='low';else if(mem!==undefined&&mem<=4)AUTO_QUALITY='medium';else if(cores<=4)AUTO_QUALITY='medium';else AUTO_QUALITY='high';}catch(e){}
const QUALITY_LEVELS={high:{maxTexDim:4096,shadowSize:4096,skySize:4096,dpr:2,normalAll:true,normalMarsOnly:false,asteroidMul:1.0,kuiperMul:1.0,atmSteps:5},medium:{maxTexDim:2048,shadowSize:2048,skySize:4000,dpr:1.5,normalAll:true,normalMarsOnly:false,asteroidMul:0.4,kuiperMul:0.4,atmSteps:5},low:{maxTexDim:1024,shadowSize:1024,skySize:1024,dpr:1,normalAll:false,normalMarsOnly:true,asteroidMul:0.2,kuiperMul:0.2,atmSteps:3}};
const QUALITY_STORAGE_KEY='solar-quality';let USER_QUALITY='auto';
const hashQ=getQualityFromHash();
if(hashQ){USER_QUALITY=hashQ;}else{const storedQ=safeStorage.get(QUALITY_STORAGE_KEY);if(storedQ&&QUALITY_LEVELS[storedQ])USER_QUALITY=storedQ;}
let QUALITY=USER_QUALITY==='auto'?AUTO_QUALITY:USER_QUALITY;
if(!QUALITY_LEVELS[QUALITY])QUALITY=AUTO_QUALITY;
const Q=QUALITY_LEVELS[QUALITY];

const _hlN=new TH.Vector3(),_hlE=new TH.Vector3(),_hlU=new TH.Vector3(),
      _hlP=new TH.Vector3(),_hlQ=new TH.Quaternion(),_hlS=new TH.Vector3(),
      _hlDir=new TH.Vector3(),_hlProj=new TH.Vector3(),_hlObs=new TH.Vector3(),
      _hlCamF=new TH.Vector3(),_hlToLabel=new TH.Vector3();

function updateHorizonLabels(){
  if(fpsState!=='stand'&&fpsState!=='fly'||!fpsAnchorLocal||!earthB){
    for(const l of HORIZON_LABELS)l.el.classList.remove('show');
    return;
  }
  const mm=earthB.m;
  mm.updateWorldMatrix(true,false);
  mm.matrixWorld.decompose(_hlP,_hlQ,_hlS);
  const R=_hlS.x,H=R*fpsHRel;
  const nL=fpsAnchorLocal;
  _hlU.copy(nL).applyQuaternion(_hlQ).normalize();
  const nLocal=new TH.Vector3(0,1,0).addScaledVector(nL,-nL.y);
  if(nLocal.lengthSq()<1e-10)nLocal.set(0,0,1);
  nLocal.normalize();
  _hlN.copy(nLocal).applyQuaternion(_hlQ).normalize();
  _hlE.crossVectors(_hlN,_hlU).normalize();
  _hlObs.copy(_hlP).addScaledVector(_hlU,R+H);
  const cosA=R/(R+H);
  const sinA=Math.sqrt(Math.max(0,1-cosA*cosA));
  const K=R*100;
  C.getWorldDirection(_hlCamF);
  for(const l of HORIZON_LABELS){
    const c=Math.cos(l.az),s=Math.sin(l.az);
    _hlDir.copy(_hlN).multiplyScalar(c*cosA)
      .addScaledVector(_hlE,s*cosA)
      .addScaledVector(_hlU,-sinA);
    _hlToLabel.copy(_hlObs).addScaledVector(_hlDir,K);
    _hlProj.copy(_hlToLabel).project(C);
    if(_hlProj.z>1){l.el.classList.remove('show');continue;}
    _hlToLabel.sub(C.position).normalize();
    if(_hlCamF.dot(_hlToLabel)<0.15){l.el.classList.remove('show');continue;}
    const x=(_hlProj.x*.5+.5)*innerWidth,y=(-_hlProj.y*.5+.5)*innerHeight;
    if(!isFinite(x)||!isFinite(y)||x<-40||x>innerWidth+40||y<-30||y>innerHeight+30){
      l.el.classList.remove('show');continue;
    }
    l.el.style.left=x+'px';
    l.el.style.top=y+'px';
    l.el.classList.add('show');
  }
}
