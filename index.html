<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Солнечная система 3D</title>
<style>
:root{--bg:#000;--fg:#e9edf5;--chip:rgba(16,20,32,.72);--acc:#ffb347;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#bar{position:fixed;left:0;right:0;bottom:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;align-items:center;justify-content:flex-start;overflow:visible;flex-wrap:nowrap}
button{flex:none;border:1px solid rgba(255,255,255,.15);background:var(--chip);color:var(--fg);padding:10px 14px;border-radius:99px;font:inherit;backdrop-filter:blur(8px);cursor:pointer}
button.on{background:var(--acc);color:#111;border-color:var(--acc)}
button.mode{background:rgba(60,120,220,.35)}
#fsBtn{width:42px;height:42px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:12px;flex:none}
#load{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .6s}
#load.done{opacity:0;pointer-events:none}
#load .spinner{
  width:48px;height:48px;
  border:3px solid rgba(255,255,255,.15);
  border-top-color:var(--acc);
  border-radius:50%;
  animation:_spin 1s linear infinite;
  display:block;
  flex:none;
  box-sizing:border-box;
}
@keyframes _spin{to{transform:rotate(360deg)}}
#load .pb{width:min(260px,70vw);height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
#load .pb i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s}
#load .tx{font-size:13px;opacity:.75;color:var(--fg)}
.dd{position:relative;z-index:30}
.dd-btn{min-width:120px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:8px}
.dd-btn .tri{font-size:10px;opacity:.7;transition:transform .2s;display:inline-block}
.dd.open .dd-btn .tri{transform:rotate(180deg)}
.dd-list{display:none;position:absolute;bottom:calc(100% + 8px);left:0;min-width:150px;max-height:min(60vh,420px);overflow-y:auto;background:rgba(12,16,28,.95);border:1px solid rgba(255,255,255,.2);border-radius:12px;backdrop-filter:blur(12px);padding:4px;z-index:40;box-shadow:0 8px 28px rgba(0,0,0,.55)}
.dd.open .dd-list{display:block}
.dd-item{display:block;width:100%;text-align:left;padding:8px 12px;border:none;border-radius:8px;background:transparent;color:var(--fg);font:inherit;cursor:pointer}
.dd-item:hover,.dd-item.on{background:rgba(255,179,71,.25)}
.dd-head{padding:9px 12px 3px;margin-top:4px;border-top:1px solid rgba(255,255,255,.14);font-size:11px;opacity:.6;pointer-events:none}
.dd-item.moon{display:flex;align-items:baseline;gap:7px;padding-left:24px;font-size:.94em}
.dd-item.moon .bl{opacity:.6}
.dd-item.moon i{font-style:italic}
#info{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;max-width:280px;background:rgba(12,16,28,.88);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:10px 14px;backdrop-filter:blur(12px);font-size:13px;line-height:1.45;opacity:0;pointer-events:none;transition:opacity .35s;z-index:10}
#info.show{opacity:1;pointer-events:auto}
#info .info-head{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;user-select:none}
#info h3{margin:0;font-size:15px;color:var(--acc)}
#info .info-tri{font-size:11px;opacity:.7;transition:transform .2s}
#info.collapsed .info-tri{transform:rotate(-90deg)}
#info .info-body{overflow:hidden;max-height:400px;transition:max-height .3s ease,opacity .25s,margin .25s}
#info.collapsed .info-body{max-height:0;opacity:0;margin:0}
#info p{margin:6px 0 4px;opacity:.9}
#info .row{display:flex;justify-content:space-between;gap:12px}
#info .k{opacity:.6}
.label{position:fixed;pointer-events:none;transform:translate(-50%,-120%);white-space:nowrap;font-size:12px;font-weight:500;color:#fff;text-shadow:0 1px 4px #000,0 0 8px rgba(0,0,0,.8);opacity:0;transition:opacity .3s;z-index:5}
.label.show{opacity:1}
.label.moon{font-size:11px;font-weight:400}
.label.moon.show{opacity:.85}

#venAtmCtl{
  position:fixed;right:12px;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:25;
  background:rgba(12,16,28,.92);border:1px solid rgba(255,255,255,.18);border-radius:10px;
  backdrop-filter:blur(12px);box-shadow:0 6px 22px rgba(0,0,0,.5);
  padding:10px 12px;display:none;align-items:center;gap:10px;font-size:11px;user-select:none;
}
#venAtmCtl.show{display:flex}
#venAtmCtl label{opacity:.75;font-size:11px}
#venAtmCtl input[type=range]{width:130px;accent-color:var(--acc);cursor:pointer}
#venAtmCtl .v{font-family:ui-monospace,monospace;font-size:10.5px;color:#e9edf5;min-width:40px;text-align:right;opacity:.9}

/* Панель ошибок */
#errPanel{
  position:fixed;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));
  z-index:9999;background:rgba(180,30,30,.95);color:#fff;
  border-radius:10px;padding:8px 12px;font:12px ui-monospace,monospace;
  max-height:38vh;overflow:auto;display:none;white-space:pre-wrap;word-break:break-word;
  box-shadow:0 6px 20px rgba(0,0,0,.6);
}
#errPanel.show{display:block}
#errPanel .h{font-weight:600;margin-bottom:4px;cursor:pointer;user-select:none}
#errPanel .line{padding:2px 0;border-bottom:1px solid rgba(255,255,255,.15)}
#errPanel .line:last-child{border-bottom:none}
</style>
</head>
<body>
<div id="load">
  <div class="spinner" aria-label="Загрузка"></div>
  <div class="pb"><i></i></div>
  <div class="tx">Загрузка…</div>
</div>
<div id="info"></div>
<div id="bar"></div>
<div id="errPanel"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ========== ПАНЕЛЬ ОШИБОК ========== */
const errPanel = document.getElementById('errPanel');
let errCount = 0, errCollapsed = false;
function showError(msg) {
  errCount++;
  errPanel.classList.add('show');
  if (errCount === 1) {
    errPanel.innerHTML = '<div class="h">Ошибки (' + errCount + ') — тап чтобы свернуть</div>';
    errPanel.querySelector('.h').addEventListener('click', () => {
      errCollapsed = !errCollapsed;
      errPanel.querySelector('.h').textContent = 'Ошибки (' + errCount + ') — тап чтобы ' + (errCollapsed ? 'развернуть' : 'свернуть');
      errPanel.querySelectorAll('.line').forEach(el => el.style.display = errCollapsed ? 'none' : 'block');
    });
  } else {
    errPanel.querySelector('.h').textContent = 'Ошибки (' + errCount + ') — тап чтобы ' + (errCollapsed ? 'развернуть' : 'свернуть');
  }
  const line = document.createElement('div');
  line.className = 'line';
  line.textContent = msg;
  if (errCollapsed) line.style.display = 'none';
  errPanel.append(line);
  console.error(msg);
}
window.addEventListener('error', e => showError('[error] ' + (e.message || e.error || 'unknown')));
window.addEventListener('unhandledrejection', e => showError('[promise] ' + (e.reason && e.reason.message || e.reason || 'unknown')));

/* ========== БЕЗОПАСНОЕ ХРАНИЛИЩЕ ========== */
const safeStorage = {
  available: false,
  get(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { window.localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  remove(k) { try { window.localStorage.removeItem(k); return true; } catch (e) { return false; } }
};
try { window.localStorage.getItem('__probe__'); safeStorage.available = true; } catch (e) {}

/* ========== ВЫБОР КАЧЕСТВА ЧЕРЕЗ URL-ХЭШ ========== */
function getQualityFromHash() {
  const m = (location.hash || '').match(/[#&]?q=(auto|high|medium|low)/);
  return m ? m[1] : null;
}

/* ========== ОПРЕДЕЛЕНИЕ УРОВНЯ КАЧЕСТВА ========== */
let AUTO_QUALITY = 'high';
try {
  const mem = navigator.deviceMemory;
  const cores = navigator.hardwareConcurrency || 4;
  if (mem !== undefined && mem <= 2) AUTO_QUALITY = 'low';
  else if (cores <= 2) AUTO_QUALITY = 'low';
  else if (mem !== undefined && mem <= 4) AUTO_QUALITY = 'medium';
  else if (cores <= 4) AUTO_QUALITY = 'medium';
  else AUTO_QUALITY = 'high';
} catch (e) { /* silent */ }

const QUALITY_LEVELS = {
  high: {
    maxTexDim: 4096, shadowSize: 4096, skySize: 4096, dpr: 2,
    normalAll: true, normalMarsOnly: false,
    asteroidMul: 1.0, kuiperMul: 1.0, atmSteps: 5
  },
  medium: {
    maxTexDim: 2048, shadowSize: 2048, skySize: 2048, dpr: 1.5,
    normalAll: true, normalMarsOnly: false,
    asteroidMul: 0.4, kuiperMul: 0.4, atmSteps: 5
  },
  low: {
    maxTexDim: 1024, shadowSize: 1024, skySize: 1024, dpr: 1,
    normalAll: false, normalMarsOnly: true,
    asteroidMul: 0.2, kuiperMul: 0.2, atmSteps: 3
  }
};

const QUALITY_STORAGE_KEY = 'solar-quality';
let USER_QUALITY = 'auto';
const hashQ = getQualityFromHash();
if (hashQ) {
  USER_QUALITY = hashQ;
} else {
  const storedQ = safeStorage.get(QUALITY_STORAGE_KEY);
  if (storedQ && QUALITY_LEVELS[storedQ]) USER_QUALITY = storedQ;
}
let QUALITY = USER_QUALITY === 'auto' ? AUTO_QUALITY : USER_QUALITY;
if (!QUALITY_LEVELS[QUALITY]) QUALITY = AUTO_QUALITY;
const Q = QUALITY_LEVELS[QUALITY];

console.log('[quality] режим=' + USER_QUALITY + ' → активен=' + QUALITY, {
  cores: navigator.hardwareConcurrency,
  memoryGB: navigator.deviceMemory,
  maxTexDim: Q.maxTexDim, shadow: Q.shadowSize, sky: Q.skySize, dpr: Q.dpr,
  storageAvailable: safeStorage.available
});

/* ========== WEB WORKER ========== */
const WORKER_SRC = `
self.onmessage = async (e) => {
  const { url, id, timeoutMs, maxDim } = e.data;
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), timeoutMs || 20000);
  try {
    const res = await fetch(url, { signal: ctl.signal, mode: 'cors' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const blob = await res.blob();
    const bitmap = await createImageBitmap(blob);
    clearTimeout(timer);
    let W = bitmap.width, H = bitmap.height;
    if (maxDim && (W > maxDim || H > maxDim)) {
      const s = Math.min(maxDim / W, maxDim / H);
      W = Math.max(64, Math.floor(W * s));
      H = Math.max(32, Math.floor(H * s));
    }
    const canvas = new OffscreenCanvas(W, H);
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(bitmap, 0, 0, W, H);
    const imageData = ctx.getImageData(0, 0, W, H);
    const buffer = imageData.data.buffer;
    self.postMessage({ id, ok: true, width: W, height: H, buffer }, [buffer]);
  } catch (err) {
    clearTimeout(timer);
    self.postMessage({ id, ok: false, error: (err && (err.name === 'AbortError' ? 'timeout' : err.message)) || 'error' });
  }
};
`;
const workerBlob = new Blob([WORKER_SRC], { type: 'application/javascript' });
const workerUrl = URL.createObjectURL(workerBlob);

/* ========== INDEXEDDB ========== */
const DB_NAME = 'solar-tex-cache-v9';
const DB_VERSION = 1;
const STORE = 'textures';
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      if (!req.result.objectStoreNames.contains(STORE)) req.result.createObjectStore(STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGet(key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readonly');
    const req = tx.objectStore(STORE).get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
async function idbPut(key, value) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

/* ========== ТЕКСТУРЫ ========== */
function configurePlanetTexture(tex) {
  if (!tex) return tex;
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.flipY = true;
  tex.anisotropy = Math.min(8, (typeof renderer !== 'undefined' && renderer.capabilities)
    ? renderer.capabilities.getMaxAnisotropy() : 4);
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.generateMipmaps = true;
  tex.needsUpdate = true;
  return tex;
}
function cropTextureX(tex, px) {
  if (!tex || !tex.image || !tex.image.data) return tex;
  const w = tex.image.width, h = tex.image.height;
  if (px <= 0 || w - px * 2 < 8) return tex;
  const src = tex.image.data;
  const nw = w - px * 2;
  const out = new Uint8Array(nw * h * 4);
  for (let y = 0; y < h; y++) {
    const rowSrc = y * w, rowDst = y * nw;
    for (let x = 0; x < nw; x++) {
      const si = (rowSrc + x + px) * 4;
      const di = (rowDst + x) * 4;
      out[di] = src[si]; out[di + 1] = src[si + 1];
      out[di + 2] = src[si + 2]; out[di + 3] = src[si + 3];
    }
  }
  const t = new THREE.DataTexture(out, nw, h, THREE.RGBAFormat);
  t.wrapS = tex.wrapS; t.wrapT = tex.wrapT; t.flipY = tex.flipY;
  t.anisotropy = tex.anisotropy; t.minFilter = tex.minFilter;
  t.magFilter = tex.magFilter; t.generateMipmaps = tex.generateMipmaps;
  t.needsUpdate = true;
  return t;
}

let MAX_TEX_DIM = Q.maxTexDim;
let _idbProbed = false, _idbOk = false;
async function probeIDB() {
  if (_idbProbed) return _idbOk;
  _idbProbed = true;
  try { const db = await openDB(); db.close(); _idbOk = true; }
  catch (e) { _idbOk = false; console.warn('[idb] кэш недоступен:', e.message || e); }
  return _idbOk;
}

async function loadTextureNoCache(url, ctx = 'tex', timeoutMs = 20000, maxDim) {
  console.log(`${ctx}: GET ${url}`);
  const result = await new Promise((resolve, reject) => {
    const id = Math.random().toString(36).slice(2);
    const handler = (e) => {
      if (e.data.id !== id) return;
      worker.removeEventListener('message', handler);
      if (e.data.ok) resolve(e.data);
      else reject(new Error(e.data.error));
    };
    worker.addEventListener('message', handler);
    worker.postMessage({ url, id, timeoutMs: timeoutMs || 20000, maxDim: maxDim || MAX_TEX_DIM });
  });
  const data = new Uint8Array(result.buffer);
  const tex = new THREE.DataTexture(data, result.width, result.height, THREE.RGBAFormat);
  return configurePlanetTexture(tex);
}

async function loadTexture(url, ctx = 'tex', timeoutMs = 20000) {
  const cacheKey = 'tex:' + url;
  const idbOk = await probeIDB();
  if (idbOk) {
    try {
      const cached = await idbGet(cacheKey);
      if (cached && cached.width && cached.height && cached.buffer) {
        const data = new Uint8Array(cached.buffer);
        const tex = new THREE.DataTexture(data, cached.width, cached.height, THREE.RGBAFormat);
        console.log(`${ctx}: из кэша ${cached.width}x${cached.height}`);
        return configurePlanetTexture(tex);
      }
    } catch (e) { console.warn(`${ctx}: кэш чтение — ${e.message || e}`); }
  }
  const result = await new Promise((resolve, reject) => {
    const id = Math.random().toString(36).slice(2);
    const handler = (e) => {
      if (e.data.id !== id) return;
      worker.removeEventListener('message', handler);
      if (e.data.ok) resolve(e.data);
      else reject(new Error(e.data.error));
    };
    worker.addEventListener('message', handler);
    worker.postMessage({ url, id, timeoutMs: timeoutMs || 20000, maxDim: MAX_TEX_DIM });
  });
  if (idbOk) {
    try { await idbPut(cacheKey, { width: result.width, height: result.height, buffer: result.buffer.slice(0) }); }
    catch (e) { console.warn(`${ctx}: кэш запись — ${e.message || e}`); }
  }
  const data = new Uint8Array(result.buffer);
  const tex = new THREE.DataTexture(data, result.width, result.height, THREE.RGBAFormat);
  return configurePlanetTexture(tex);
}

/* ========== ОСНОВНОЙ КОД ========== */
const TH = THREE, PI = Math.PI, $ = s => document.querySelector(s), rnd = Math.random;
let renderer;
try {
  renderer = new TH.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', precision: 'highp' });
} catch (e) {
  document.getElementById('load').innerHTML = '<div class="tx" style="text-align:center;padding:20px">WebGL недоступен в этом браузере.<br>Попробуйте другой браузер или устройство.</div>';
  showError('[webgl-init] ' + (e.message || e));
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, Q.dpr));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = TH.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

MAX_TEX_DIM = Math.min(Q.maxTexDim, renderer.capabilities.maxTextureSize);
const MAX_SKY_DIM = Math.min(Q.skySize, renderer.capabilities.maxTextureSize);

(function logGpuInfo() {
  try {
    const gl = renderer.getContext();
    console.log(`[env] protocol=${location.protocol} origin=${location.origin || '(null)'} mobile=${/Mobi|Android/i.test(navigator.userAgent)}`);
    console.log(`[env] DPR=${devicePixelRatio}, viewport=${innerWidth}x${innerHeight}, effective DPR=${Math.min(devicePixelRatio, Q.dpr)}`);
    console.log(`[gpu] maxTextureSize=${gl.getParameter(gl.MAX_TEXTURE_SIZE)} effectiveMaxTexDim=${MAX_TEX_DIM} effectiveMaxSkyDim=${MAX_SKY_DIM}`);
  } catch (e) { console.warn('[gpu] info недоступно: ' + (e.message || e)); }
})();

renderer.domElement.addEventListener('webglcontextlost', e => { e.preventDefault(); showError('[webgl] CONTEXT LOST — ' + (e.statusMessage || 'без причины')); });
renderer.domElement.addEventListener('webglcontextrestored', () => console.warn('[webgl] context restored'));

const worker = new Worker(workerUrl);
worker.onerror = (e) => showError('[worker] ' + (e.message || e));

(async () => {
  const ld = $('#load'), lb = ld.querySelector('i'), lt = ld.querySelector('.tx');
  const tick = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
  let _lastProg = 0;
  const prog = async (p, t) => {
    const v = Math.max(_lastProg, Math.min(100, Number(p) || 0));
    _lastProg = v; lb.style.width = v + '%';
    if (t) lt.textContent = t;
    await tick();
  };

  try {
    console.log('[phase] scene init');
    const S = new TH.Scene(), C = new TH.PerspectiveCamera(55, innerWidth / innerHeight, .001, 2000000);

    const H = (x, y, z) => { const n = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453; return n - Math.floor(n); };
    const sm = t => t * t * (3 - 2 * t), L = (u, v, t) => u + (v - u) * t;
    const HR = 72, HS = 2 * HR + 1, HV = new Float32Array(HS * HS * HS), HFl = new Uint8Array(HS * HS * HS);
    const hf = (i, j, k) => { let n = Math.imul(i, 374761393) ^ Math.imul(j, 668265263) ^ Math.imul(k, 1274126177); n = Math.imul(n ^ (n >>> 13), 1274126177); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; };
    const Hc = (i, j, k) => { if (i < -HR || i > HR || j < -HR || j > HR || k < -HR || k > HR) return hf(i, j, k); const id = ((i + HR) * HS + (j + HR)) * HS + (k + HR); return HFl[id] ? HV[id] : (HFl[id] = 1, HV[id] = H(i, j, k)); };
    function N(x, y, z) { const i = Math.floor(x), j = Math.floor(y), k = Math.floor(z), a = sm(x - i), b = sm(y - j), c = sm(z - k), h = (p, q, r) => Hc(i + p, j + q, k + r), m = (q, r) => L(h(0, q, r), h(1, q, r), a), n = r => L(m(0, r), m(1, r), b); return L(n(0), n(1), c); }
    const F = (x, y, z, o = 5) => { let s = 0, a = .5; for (let i = 0; i < o; i++) { s += a * N(x, y, z); x *= 2; y *= 2; z *= 2; a /= 2; } return s * 1.03; };

    const tx = {};
    const MTEX = {
      'Ио': 'io', 'Европа': 'europa', 'Ганимед': 'ganymede', 'Каллисто': 'callisto',
      'Фобос': 'phobos', 'Деймос': 'deimos', 'Титан': 'titan', 'Харон': 'cha',
      'Рея': 'rhea', 'Диона': 'dione',
      'Титания': 'titania', 'Оберон': 'oberon', 'Тритон': 'triton',
      'Никта': 'nix', 'Гидра': 'hydra',
      'Намака': 'namaka', 'Хииака': 'hiiaka', 'Дисномия': 'dysnomia'
    };
    const NL = 'https://raw.githubusercontent.com/VladislavMardashov/WebSolarSystem/main/textures/';

    const TEX_URLS = {

          if (b.vatm) b.vatm.scale.setScalar(f * 1.015);
          if (b.ringMesh) b.ringMesh.scale.setScalar(f);
          b.mo.forEach(p => {
            const ud = p.userData;
            const dist = (ud.mdist || 384400) / KM_PER_UNIT;
            p.children[0].scale.setScalar((ud.mkm || 1737) / KM_PER_UNIT);
            p.children[0].position.x = dist;
            if (ud.orbit) {
              const pts = []; for (let i = 0; i <= 128; i++) { const t = i / 128 * 2 * PI; pts.push(new TH.Vector3(Math.cos(t) * dist, 0, Math.sin(t) * dist)); }
              ud.orbit.geometry.dispose(); ud.orbit.geometry = new TH.BufferGeometry().setFromPoints(pts);
            }
          });
          b.r = f;
        } else {
          setPl(b, b.baseR0);
          if (b.atm) b.atm.scale.setScalar(b.baseR0);
          if (b.cloudsMesh) b.cloudsMesh.scale.setScalar(b.baseR0 * 1.012);
          if (b.vatm) b.vatm.scale.setScalar(b.baseR0 * 1.02);
          if (b.ringMesh) b.ringMesh.scale.setScalar(b.baseR0);
          b.mo.forEach(p => {
            const ud = p.userData;
            p.children[0].scale.setScalar(ud.mr);
            p.children[0].position.x = ud.d;
            if (ud.orbit) {
              const pts = []; for (let i = 0; i <= 128; i++) { const t = i / 128 * 2 * PI; pts.push(new TH.Vector3(Math.cos(t) * ud.d, 0, Math.sin(t) * ud.d)); }
              ud.orbit.geometry.dispose(); ud.orbit.geometry = new TH.BufferGeometry().setFromPoints(pts);
            }
          });
          b.r = b.baseR0;
        }
      }
      bodies[0].d = real ? AU_TO_UNITS * 2.5 : ov;
      bodies[0].r = real ? sunScale : 8;
      bodies[1].r = real ? sunScale : 8;
      fill();
    }

    const labels = [];
    function clearLabels() { labels.forEach(l => l.el.remove()); labels.length = 0; }
    function makeLabel(text, isMoon) { const el = document.createElement('div'); el.className = 'label' + (isMoon ? ' moon' : ''); el.textContent = text; document.body.appendChild(el); return el; }
    function updateLabels() {
      const v = new TH.Vector3();
      labels.forEach(l => {
        if (!l.obj) return;
        l.obj.getWorldPosition(v); v.project(C);
        const x = (v.x * .5 + .5) * innerWidth, y = (-v.y * .5 + .5) * innerHeight;
        if (v.z > 1 || !isFinite(x) || !isFinite(y) || x < -24 || x > innerWidth + 24 || y < -12 || y > innerHeight + 12) l.el.classList.remove('show');
        else { l.el.style.left = x + 'px'; l.el.style.top = y + 'px'; l.el.classList.add('show'); }
      });
    }
    let infoCollapsed = false;
    function showInfo(b) {
      const el = $('#info');
      if (b.isMoon) {
        el.innerHTML = `<div class="info-head"><h3>${b.n}</h3><span class="info-tri">▼</span></div><div class="info-body"><p>Спутник планеты: ${b.parent.n}</p><div class="row"><span class="k">Радиус</span><span>${b.ud.mkm.toLocaleString('ru')} км</span></div><div class="row"><span class="k">Расстояние до планеты</span><span>${b.ud.mdist.toLocaleString('ru')} км</span></div></div>`;
        el.classList.toggle('collapsed', infoCollapsed); el.classList.add('show');
        el.querySelector('.info-head').onclick = () => { infoCollapsed = !infoCollapsed; el.classList.toggle('collapsed', infoCollapsed); };
        return;
      }
      if (b.isRoot) { el.classList.remove('show'); return; }
      let body = '';
      if (b.isSun) {
        body = `<p>${b.info || ''}</p><div class="row"><span class="k">Радиус</span><span>696 340 км</span></div><div class="row"><span class="k">Масса</span><span>1,989×10³⁰ кг</span></div><div class="row"><span class="k">Темп. поверхности</span><span>≈ 5500 °C</span></div>`;
      } else {
        body = `<p>${b.info || ''}</p><div class="row"><span class="k">Радиус</span><span>${b.kmR.toLocaleString('ru')} км</span></div><div class="row"><span class="k">Орбита</span><span>${b.au} а.е.</span></div><div class="row"><span class="k">Период</span><span>${b.T} лет</span></div><div class="row"><span class="k">Эксцентриситет</span><span>${b.ecc}</span></div><div class="row"><span class="k">Свет Солнца</span><span>${(v => v >= 100 ? Math.round(v) : v >= 1 ? v.toFixed(1) : v.toPrecision(2))(100 / (b.au * b.au))}% от земного</span></div><div class="row"><span class="k">Наклон оси</span><span>${b.tilt == null ? '—' : b.tilt + '°'}</span></div>`;
        if (b.mo && b.mo.length) body += `<div class="row"><span class="k">Спутники</span><span>${b.mo.map(p => p.userData.name).join(', ')}</span></div>`;
      }
      el.innerHTML = `<div class="info-head"><h3>${b.n}</h3><span class="info-tri">▼</span></div><div class="info-body">${body}</div>`;
      el.classList.toggle('collapsed', infoCollapsed);
      el.classList.add('show');
      el.querySelector('.info-head').onclick = () => { infoCollapsed = !infoCollapsed; el.classList.toggle('collapsed', infoCollapsed); };
    }

    const bar = $('#bar');
    const drop = document.createElement('div'); drop.className = 'dd';
    const dropBtn = document.createElement('button'); dropBtn.className = 'dd-btn';
    const dropList = document.createElement('div'); dropList.className = 'dd-list';

    function pick(i) {
      const b = targets[i]; ci = i; off.copy(tgv).sub(wpos(b)); cur = b;
      dd = b.d || (b.isSun ? (real ? sunM.scale.x * 3.5 : 100) : b.isMoon ? (real ? b.r * 8 : b.r * 7 + 6) : b.r * (real ? 5 : 7) + (real ? Math.min(6, b.r * 8) : 6));
      dropBtn.innerHTML = b.n + ' <span class="tri">▲</span>';
      dropList.querySelectorAll('.dd-item').forEach((el, j) => el.classList.toggle('on', j === i));
      clearLabels();
      bodies.forEach(bb => { if (bb.mo) bb.mo.forEach(p => { if (p.userData.orbit) p.userData.orbit.visible = false; }); });
      const pb = b.isMoon ? b.parent : b;
      if (pb.mo && pb.mo.length) {
        pb.mo.forEach(p => { const ml = makeLabel(p.userData.name, true); labels.push({ el: ml, obj: p.children[0] }); if (p.userData.orbit) p.userData.orbit.visible = true; });
      }
      venCtl.classList.toggle('show', !b.isMoon && b.k === 'ven');
      showInfo(b);
    }

    {
      const fsBtn = document.createElement('button'); fsBtn.id = 'fsBtn'; fsBtn.title = 'Полноэкранный режим';
      const fsEnter = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>`;
      const fsExit = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg>`;
      fsBtn.innerHTML = fsEnter;
      fsBtn.onclick = () => { if (!document.fullscreenElement) { document.documentElement.requestFullscreen?.() || document.documentElement.webkitRequestFullscreen?.(); } else { document.exitFullscreen?.() || document.webkitExitFullscreen?.(); } };
      document.addEventListener('fullscreenchange', () => { fsBtn.innerHTML = document.fullscreenElement ? fsExit : fsEnter; });
      document.addEventListener('webkitfullscreenchange', () => { fsBtn.innerHTML = document.fullscreenElement ? fsExit : fsEnter; });
      bar.append(fsBtn);
    }
    {
      const rb = document.createElement('button'); rb.className = 'mode'; rb.textContent = 'Упрощённый';
      rb.onclick = () => {
        real ^= 1;
        rb.textContent = real ? 'Реализм' : 'Упрощённый';
        rb.classList.toggle('on', !!real);
        apply(); pick(ci);
      };
      bar.append(rb);
    }
    dropBtn.innerHTML = 'Обзор <span class="tri">▲</span>';
    const hd = t => { const e = document.createElement('div'); e.className = 'dd-head'; e.textContent = t; return e; };
    const fp = bodies.find(b => !b.isRoot && !b.isSun && !b.dw), fd = bodies.find(b => b.dw);
    targets.forEach((b, i) => {
      if (b === fp) dropList.append(hd('Планеты'));
      if (b === fd) dropList.append(hd('Карликовые планеты'));
      const item = document.createElement('button'); item.className = 'dd-item' + (b.isMoon ? ' moon' : '');
      if (b.isMoon) { const bl = document.createElement('span'); bl.className = 'bl'; bl.textContent = '•'; const it = document.createElement('i'); it.textContent = b.n; item.append(bl, it); }
      else item.textContent = b.n;
      item.onclick = (e) => { e.stopPropagation(); pick(i); drop.classList.remove('open'); };
      dropList.append(item);
    });
    dropBtn.onclick = e => { e.stopPropagation(); drop.classList.toggle('open'); if (drop.classList.contains('open')) { const on = dropList.querySelector('.dd-item.on'); if (on) on.scrollIntoView({ block: 'center' }); } };
    drop.append(dropBtn, dropList); bar.append(drop);
    document.addEventListener('click', () => drop.classList.remove('open'));

    {
      const sb = document.createElement('button'); sb.textContent = '×1'; sb.style.marginLeft = 'auto';
      sb.onclick = () => { spI = (spI + 1) % 4; sb.textContent = ['Пауза', '×1', '×4', '×16'][spI]; };
      bar.append(sb);
    }

    apply(); pick(0);
    console.log('[phase] ready');

    function loop(now) {
      requestAnimationFrame(loop);
      const dt = Math.min((now - last) / 1000, .05); last = now;
      const s = [0, 1, 4, 16][spI], q = Math.sqrt(s); tm += dt * s; mt += dt * q;
      sunM.rotation.y += dt * .004 * q;
      if (real) {
        glow.material.opacity = 0.95 + 0.05 * Math.sin(now / 600);
        gl2.material.opacity = 0.88 + 0.05 * Math.sin(now / 700);
        gl3.material.opacity = 0.50 + 0.05 * Math.sin(now / 800);
        gl4.material.opacity = 0.28 + 0.04 * Math.sin(now / 900);
        gl5.material.opacity = 0.15 + 0.03 * Math.sin(now / 1100);
      } else {
        glow.material.opacity = 0.85 + 0.1 * Math.sin(now / 600);
        gl3.material.opacity = 0.28 + 0.04 * Math.sin(now / 900);
        gl4.material.opacity = 0.16 + 0.03 * Math.sin(now / 1000);
        gl5.material.opacity = 0.09 + 0.02 * Math.sin(now / 1200);
      }
      place(); updateLocalOrbit();
      for (const b of bodies) {
        if (b.isRoot || b.isSun) continue;
        b.m.rotation.y += dt * q * (b.k in SPIN ? SPIN[b.k] : b.T > 5 ? .3 : .14);
        if (b.cloudsMesh) b.cloudsMesh.rotation.y = b.m.rotation.y * 1.06 + .7;
        if (b.vatm) b.vatm.rotation.y = b.m.rotation.y * 1.15 + .3;
        for (const p of b.mo) p.rotation.y = p.userData.ph + mt * p.userData.sp * 0.1;
        if (b.ringMesh) b.ringMesh.rotation.z += dt * q * 0.08;
      }
      belts.forEach((bt, k) => { bt.rotation.y = tm * bt.userData.w; bms[k].rotation.y = bt.rotation.y; });
      kbs.forEach(k => { k.rotation.y = tm * k.userData.w; });
      off.multiplyScalar(Math.exp(-dt * 4)); tgv.copy(wpos(cur)).add(off);
      dist += (dd - dist) * Math.min(1, dt * 6);
      C.position.set(tgv.x + dist * Math.sin(ph) * Math.sin(th), tgv.y + dist * Math.cos(ph), tgv.z + dist * Math.sin(ph) * Math.cos(th));
      C.lookAt(tgv);
      C.near = Math.max(dist * .004, .0005); C.far = 1e8; C.updateProjectionMatrix();
      sky.scale.setScalar(Math.max(1, dist / 1000)); sky.position.copy(C.position);
      glow.position.copy(sunM.position); gl2.position.copy(sunM.position); gl3.position.copy(sunM.position); gl4.position.copy(sunM.position); gl5.position.copy(sunM.position);
      C.updateMatrixWorld(); C.matrixWorldInverse.copy(C.matrixWorld).invert();
      earthU.uSunV.value.copy(earthB.g.position).negate().normalize().transformDirection(C.matrixWorldInverse);

      if (skySphere) {
        let bright = SIM_SKY_BRIGHT;
        if (real) {
          let rAU;
          if (cur.isSun || cur.isRoot) rAU = 0;
          else if (cur.isMoon) rAU = cur.parent.g.position.length() / AU_TO_UNITS;
          else rAU = cur.g.position.length() / AU_TO_UNITS;
          const t = Math.min(rAU / SKY_REF, 1);
          bright = SKY_SUN + (1 - SKY_SUN) * t;
        }
        skySphere.userData.uni.uBright.value = bright;
      }

      let sOf = null;
      {
        if (real) { sOf = pos => Math.min(1e4, Math.pow(1 / Math.max(.02, pos / AU_TO_UNITS), 0.5)); }
        if (real || wasP) {
          const sc = (mat, s) => {
            if (!mat) return;
            const u = mat.userData, c0 = u.c0 || (u.c0 = mat.color.clone());
            mat.color.copy(c0).multiplyScalar(s);
            if (!mat.emissiveMap) { if (u.e0 === undefined) u.e0 = mat.emissiveIntensity; mat.emissiveIntensity = u.e0 * s; }
          };
          for (const b of bodies) {
            if (!b.m) continue;
            const s = real ? sOf(b.g.position.length()) : 1;
            sc(b.m.material, s); if (b.cloudsMesh) sc(b.cloudsMesh.material, s); if (b.vatm) sc(b.vatm.material, s); if (b.ringMesh) sc(b.ringMesh.material, s);
            for (const p of b.mo) sc(p.children[0].material, s);
          }
          belts.forEach((bt, k) => sc(bt.material, real ? sOf(BC[k].c * AU_TO_UNITS) : 1));
          wasP = real;
        }
      }
      for (const b of bodies) {
        if (!b.atm) continue;
        const U = b.atm.material.uniforms;
        U.uI.value = b.atm.userData.I0 * (real ? sOf(b.g.position.length()) : Math.max(0, 1 - b.g.position.length() / sunLight.distance) / sunLight.userData.fm);
        const ta = -b.tilt * PI / 180;
        U.uC.value.copy(C.position).sub(b.g.position).divideScalar(b.atm.scale.x).applyAxisAngle(ZA, ta);
        U.uS.value.copy(b.g.position).negate().normalize().applyAxisAngle(ZA, ta);
      }
      {
        const R = satB.ringU;
        R.uSun.value.copy(satB.g.position).negate();
        R.uA.value = satB.m.scale.x; R.uCc.value = satB.m.scale.y; R.uS.value = satB.ringMesh.scale.x;
      }
      renderer.render(S, C);
      updateLabels();
    }

    await prog(100, 'Готово'); ld.classList.add('done');
    setTimeout(() => ld.remove(), 800);
    requestAnimationFrame(loop);
  } catch (e) {
    showError('[fatal] ' + (e && e.message || e));
    lt.textContent = 'Ошибка загрузки: ' + (e && e.message || e);
    console.error(e);
  }
})();
</script>
</body>
</html>
